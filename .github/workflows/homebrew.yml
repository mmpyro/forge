name: Homebrew

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to publish to Homebrew (e.g. 1.0.1 or v1.0.1). Must be an existing, non-prerelease GitHub release."
        required: true
        type: string

concurrency:
  group: homebrew
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  formula:
    name: Update Formula/helm-forge.rb
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Normalize version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version=${INPUT#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z, got '$INPUT'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Deploy key is on the ruleset bypass list, so the bot can push to protected main.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Download checksums.txt
        run: gh release download "${{ steps.version.outputs.tag }}" -p checksums.txt -D "$RUNNER_TEMP"

      - name: Render formula
        run: |
          scripts/homebrew-formula.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/checksums.txt" > Formula/helm-forge.rb
          cat Formula/helm-forge.rb

      - name: Commit
        id: commit
        run: |
          if git diff --quiet -- Formula/helm-forge.rb; then
            echo "Formula already at ${{ steps.version.outputs.version }}, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/helm-forge.rb
          git commit -m "helm-forge ${{ steps.version.outputs.version }} [skip ci]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # brew only installs formulae from taps, so tap the local checkout (it reads the committed HEAD).
      - name: Install and test with brew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew style Formula/helm-forge.rb
          brew tap mmpyro/forge "$GITHUB_WORKSPACE"
          brew install mmpyro/forge/helm-forge
          brew test mmpyro/forge/helm-forge
          forge --version

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Write summary
        run: |
          {
            echo "## Homebrew ${{ steps.version.outputs.tag }}"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "Pushed \`Formula/helm-forge.rb\` → ${{ steps.version.outputs.version }}."
            else
              echo "Formula already up to date."
            fi
            echo
            echo '```sh'
            echo "brew tap mmpyro/forge https://github.com/mmpyro/forge"
            echo "brew install helm-forge"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
