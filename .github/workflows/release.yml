name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # `helm plugin install … --version vX.Y.Z` checks out the tag and downloads the
  # binary named by plugin.yaml's version, so the two must match.
  plugin-version:
    name: plugin.yaml version matches tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compare versions
        run: |
          want=${GITHUB_REF_NAME#v}
          got=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' plugin.yaml)
          if [ "$got" != "$want" ]; then
            echo "::error file=plugin.yaml::plugin.yaml version is '$got' but the tag is $GITHUB_REF_NAME; bump plugin.yaml before tagging"
            exit 1
          fi
          echo "plugin.yaml version $got matches $GITHUB_REF_NAME"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [ci, plugin-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, native: true }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64 }
          - { runner: macos-latest, goos: darwin, goarch: arm64, native: true }
          - { runner: macos-latest, goos: darwin, goarch: amd64 }
          - { runner: windows-latest, goos: windows, goarch: amd64, native: true, ext: .exe }
          - { runner: windows-latest, goos: windows, goarch: arm64, ext: .exe }
    defaults:
      run:
        shell: bash
    env:
      BIN: dist/forge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME#v}" \
            -o "$BIN" ./cmd/forge

      - name: Smoke test
        if: matrix.native
        run: |
          out=$("./$BIN" --version)
          echo "$out"
          grep -qF "forge ${GITHUB_REF_NAME#v}" <<<"$out"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for release notes

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: forge-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum forge-* > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        id: release_notes
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(git log "${PREVIOUS_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log "${CURRENT_TAG}" --pretty=format:"- %s (%h)" --no-merges)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="No changes recorded."
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      - name: Write summary
        env:
          NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          {
            echo "## Release ${{ github.ref_name }}"
            echo
            echo "| File | Size | sha256 |"
            echo "|---|---|---|"
            for f in dist/forge-*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-64)\` |"
            done
            echo
            echo "### Changes"
            echo
            echo "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

  plugin-smoke:
    name: helm plugin install (${{ matrix.os }}, Helm ${{ matrix.helm }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        helm: [v3.22.0, v4.1.4]
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}

      # Installs from GitHub exactly as users do: git checkout of the tag, then the
      # install hook downloads the release binary and checks it against checksums.txt.
      - name: Install plugin from GitHub
        run: |
          flags=(--version "$GITHUB_REF_NAME")
          # Helm 4 verifies plugin signatures by default; git sources can't be verified.
          [[ "${{ matrix.helm }}" == v4* ]] && flags+=(--verify=false)
          helm plugin install "https://github.com/${{ github.repository }}" "${flags[@]}"

      - name: Run helm forge
        run: |
          out=$(helm forge --version | head -1)
          echo "$out"
          [ "$out" = "forge ${GITHUB_REF_NAME#v}" ]
          helm forge dep --help >/dev/null
